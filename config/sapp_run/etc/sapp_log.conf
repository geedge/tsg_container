[global]
default format = "%d(%c), %V, %U, %m%n"
[levels]
DEBUG=10
INFO=20
FATAL=30
[formats]
other = "%d(%c), %V, %F, %U, %m%n"
plugin = "%d(%c), %m%n"
[rules]
__log_runtimelog.info    "./log/runtimelog.%d(%F)"
__log_runtimelog_plugin.fatal    >stdout; plugin
__log_runtimelog_plugin.info    "./log/plugin.log.%d(%F)"; plugin
!.*    "./log/%c.%d(%F)"; other
