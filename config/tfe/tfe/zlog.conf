# kill -s SIGHUP "pid"

[global]

default format = "%d(%c), %V, %F, %U, %m%n"

[levels]

DEBUG=10
INFO=20
FATAL=30

[rules]

*.fatal        "./log/error.log.%d(%F)";
tfe.DEBUG      "./log/tfe.log.%d(%F)";
http.DEBUG     "./log/http.log.%d(%F)";
http2.DEBUG    "./log/http2.log.%d(%F)";
doh.DEBUG      "./log/doh_pxy.log.%d(%F)";
pangu.DEBUG    "./log/pangu_pxy.log.%d(%F)";