[device]
device=virtio_user0
virtio_user=virtio_user0

[service]
# lcore id for i/o service, use comma to split
iocore=1,2,3,4
distmode=2
hashmode=0

[eal]
virtaddr=0x7f40c4a00000
loglevel=7
no-pci=1

[keepalive]
check_spinlock=1

[pool]
create_mode=3
sz_direct_pktmbuf=65536
sz_indirect_pktmbuf=8192
sz_cache=256
