[device]
device=eth0,vxlan_user,vxlan_fwd
sz_tunnel=8192
sz_buffer=0

[device:eth0]
jumbo_frame=1
max_rx_pkt_len=15360
clear_tx_flags=1
promisc=1

[service]
# lcore id for i/o service, use comma to split
iocore=46,47
distmode=2
hashmode=0

[eal]
virtaddr=0x7f40c4a00000
loglevel=7

[keepalive]
check_spinlock=0

[ctrlzone]
ctrlzone0=tunnat,64

[pool]
create_mode=3
sz_direct_pktmbuf=4194304
sz_indirect_pktmbuf=8192
sz_cache=256
sz_data=4096

