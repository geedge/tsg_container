[device]
device=virtio_user0,virtio_user1
virtio_user=virtio_user0,virtio_user1
sz_tunnel=8192
sz_buffer=0

[device:virtio_user0]
in_addr=192.168.1.30
in_mask=255.255.255.0
promisc=1

[device:virtio_user1]
promisc=1

[service]
# lcore id for i/o service, use comma to split
iocore=1,2,3,4
distmode=2
hashmode=0

[eal]
virtaddr=0x7f40c4a00000
loglevel=8
no-pci=1
mem=4096
single-file-segments=0

[ctrlzone]
ctrlzone0=tunnat,64

[keepalive]
check_spinlock=1

[pool]
create_mode=3
sz_direct_pktmbuf=65536
sz_indirect_pktmbuf=8192
sz_cache=256
